name: Vehicle Guide Generator

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 2:00 AM UTC (7:30 AM IST)
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  generate-vehicles:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci || npm install
        
      - name: Run Vehicle Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_INDEXING_SA_KEY: ${{ secrets.GOOGLE_INDEXING_SA_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/vehicle-generator.js
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          if git diff --staged --quiet; then
            echo "No new vehicles generated."
          else
            git commit -m "auto: 2 new vehicle guides published"
            git push
          fi
